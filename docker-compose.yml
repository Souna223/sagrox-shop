services:
  postgres:
    image: postgres:16-alpine
    container_name: wbsite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wbsite
      POSTGRES_PASSWORD: wbsite
      POSTGRES_DB: wbsite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wbsite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
